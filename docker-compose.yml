# Production stack: several copies of the app behind Caddy (load balancer + automatic HTTPS).
#
#   docker compose up -d --build                 → https://localhost (Caddy's local certificate)
#   SITE_ADDRESS=baydesignstore.com docker compose up -d --build
#                                                → real Let's Encrypt certificate for your domain
#   APP_REPLICAS=6 docker compose up -d --scale app=6
#
# Every copy reads the same .env.local. Sessions are signed tokens and sign-in limits live in
# the database, so any copy can serve any request. HTTPS is required: the sign-in cookie is
# "Secure" in production, so plain http:// can't keep anyone signed in.

services:
  app:
    build: .
    image: bay-design:latest
    env_file: .env.local
    environment:
      NODE_ENV: production
      # Database queries in flight per copy (Supabase free plan: keep the total around 60–100).
      DB_MAX_CONCURRENCY: "20"
    deploy:
      replicas: ${APP_REPLICAS:-4}
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
